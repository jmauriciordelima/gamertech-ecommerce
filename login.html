<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GamerTech</title>
    <link rel="icon" href="img/logo-icone.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark d-flex align-items-center py-4 vh-100">

    <main class="form-signin w-100 m-auto max-width-400 p-4 bg-white rounded shadow">
        <form>
            <div class="text-center mb-4">
                <img src="img/logo-icone.png" alt="Logo GamerTech" class="logo mb-3">
                <h1 class="h3 mb-3 fw-normal">Acessar Conta</h1>
            </div>

            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="nome@exemplo.com" required>
                <label for="floatingInput">E-mail</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Senha" required>
                <label for="floatingPassword">Senha</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary mb-3" type="submit">Entrar</button>
            <a href="index.html" class="w-100 btn btn-lg btn-outline-secondary">Voltar ao Início</a>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
